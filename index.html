<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeşil Cafe</title>
  <style>
    * { box-sizing: border-box; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1713;
      color: #f4ead2;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(rgba(10,18,14,.72), rgba(10,18,14,.88)),
                  url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;
      text-align: center;
      padding: 70px 20px 50px;
      border-bottom: 1px solid rgba(212,178,97,.25);
    }

    header h1 {
      margin: 0;
      font-size: 56px;
      color: #e0b96e;
      letter-spacing: 1px;
    }

    header p {
      margin: 12px 0 25px;
      font-size: 20px;
      color: #f4ead2;
    }

    .top-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #cda85f;
      transition: .2s ease;
    }

    .btn-primary {
      background: #cda85f;
      color: #132018;
    }

    .btn-primary:hover {
      background: #e3bf79;
    }

    .btn-secondary {
      color: #f4ead2;
      background: rgba(255,255,255,.03);
    }

    .btn-secondary:hover {
      background: rgba(205,168,95,.13);
    }

    .menu-nav {
      max-width: 1150px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 0 10px;
    }

    .menu-nav a {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(212,178,97,.28);
      font-size: 14px;
      color: #f4ead2;
      background: rgba(255,255,255,.03);
    }

    .menu-nav a:hover {
      background: rgba(205,168,95,.15);
    }

    section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 46px 18px;
    }

    .intro {
      text-align: center;
    }

    .intro h2,
    .section-title {
      color: #e0b96e;
      font-size: 34px;
      margin: 0 0 15px;
      text-align: center;
    }

    .intro p {
      max-width: 760px;
      margin: 0 auto;
      font-size: 18px;
      color: #ead9b2;
    }

    .category-block {
      margin-top: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
      border: 1px solid rgba(212,178,97,.18);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }

    .subgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .menu-card {
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(212,178,97,.14);
      border-radius: 16px;
      padding: 18px;
    }

    .menu-card h3 {
      margin: 0 0 12px;
      color: #e0b96e;
      font-size: 24px;
      border-bottom: 1px solid rgba(212,178,97,.18);
      padding-bottom: 8px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 7px 0;
      border-bottom: 1px dashed rgba(255,255,255,.08);
    }

    .item:last-child { border-bottom: none; }

    .price {
      color: #e0b96e;
      font-weight: bold;
      white-space: nowrap;
    }

    .note {
      margin-top: 10px;
      color: #d7c69e;
      font-size: 14px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .gallery-grid img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      display: block;
    }

    .contact-box {
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(212,178,97,.18);
      border-radius: 16px;
      padding: 24px;
      text-align: center;<div class="item"><span>Türk Çayı (Bardak)</span><span class="price">35₺</span></div>
          <div class="item"><span>Türk Çayı (Fincan)</span><span class="price">50₺</span></div>
          <div class="item"><span>İran Çayı (Bardak)</span><span class="price">60₺</span></div>
          <div class="item"><span>İran Çayı (Fincan)</span><span class="price">75₺</span></div>
          <div class="item"><span>Zencefil & Nane</span><span class="price">80₺</span></div>
          <div class="item"><span>Kekik</span><span class="price">90₺</span></div>
        </div>
      </div>
    </div>

          <div class="item"><span>Affogato</span><span class="price">225₺</span></div>

        <div class="menu-card">

          <div class="item"><span>Su</span><span class="price">30₺</span></div>
        </div>
      </div>
    </div>
