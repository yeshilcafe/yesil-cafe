<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yeşil Cafe</title>
<style>
:root{
--bg:#0f1714;
--bg-soft:#16211d;
--card:#1a2722;
--gold:#d8b36a;
--gold-soft:#efd9a0;
--text:#f7f1de;
--muted:#d7ccb2;
--line:rgba(216,179,106,.22);
--shadow:0 12px 30px rgba(0,0,0,.28);
--radius:20px;
}

*{
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
margin:0;
font-family: "Georgia", "Times New Roman", serif;
background:
radial-gradient(circle at top, rgba(216,179,106,.08), transparent 20%),
linear-gradient(180deg,#0d1412,#101917 35%,#0d1412 100%);
color:var(--text);
}

a{
text-decoration:none;
color:inherit;
}

img{
max-width:100%;
display:block;
}

.hero{
min-height:88vh;
background:
linear-gradient(rgba(7,10,9,.52), rgba(7,10,9,.78)),
url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px 20px;
border-bottom:1px solid var(--line);
}

.hero-box{
max-width:1000px;
width:100%;
padding:40px 20px;
backdrop-filter: blur(3px);
}

.brand{
font-size:clamp(44px,7vw,92px);
color:var(--gold-soft);
margin:0 0 10px;
letter-spacing:1px;
line-height:1;
text-shadow:0 4px 18px rgba(0,0,0,.35);
}

.tagline{
font-size:clamp(18px,2vw,28px);
margin:0 0 28px;
color:#f6ebce;
}

.cta-row{
display:flex;
flex-wrap:wrap;
gap:14px;
justify-content:center;
margin-bottom:22px;
}

.btn{
padding:13px 22px;
border-radius:999px;
border:1px solid var(--gold);
font-weight:700;
transition:.2s ease;
box-shadow:var(--shadow);
}

.btn-primary{
background:var(--gold);
color:#1a1a1a;
}

.btn-primary:hover{
transform:translateY(-1px);
background:#e8c57d;
}

.btn-secondary{
background:rgba(255,255,255,.04);
color:var(--text);
}

.btn-secondary:hover{
background:rgba(216,179,106,.12);
}

.chip-nav{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
max-width:1000px;
margin:0 auto;
}

.chip{
padding:9px 14px;
border-radius:999px;
border:1px solid rgba(255,255,255,.14);
background:rgba(0,0,0,.22);
font-size:14px;
color:#f7f0dd;
}

.chip:hover{
border-color:var(--gold);
color:var(--gold-soft);
}

.container{
max-width:1240px;
margin:0 auto;
padding:36px 18px 70px;
}

.intro{
background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
border:1px solid var(--line);
border-radius:var(--radius);
padding:28px;
text-align:center;
box-shadow:var(--shadow);
margin-top:-42px;
position:relative;
z-index:2;
}

.intro h2{
margin:0 0 10px;
color:var(--gold-soft);
font-size:36px;
}

.intro p{
margin:0 auto;
max-width:850px;
color:var(--muted);
font-size:18px;
line-height:1.8;
}

.section{
margin-top:34px;
background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
border:1px solid var(--line);
border-radius:var(--radius);
overflow:hidden;
box-shadow:var(--shadow);
}

.section-head{
display:grid;
grid-template-columns:1.2fr 1fr;
gap:0;
align-items:stretch;
border-bottom:1px solid var(--line);
}

.section-title-wrap{
padding:28px 26px;
background:linear-gradient(135deg, rgba(216,179,106,.08), rgba(255,255,255,.01));
}

.section-kicker{
font-size:14px;
letter-spacing:2px;
text-transform:uppercase;
color:var(--gold);
margin-bottom:8px;
}

.section-title{
margin:0 0 10px;
font-size:44px;
color:var(--gold-soft);
line-height:1.05;
}

.section-desc{
margin:0;
color:var(--muted);
font-size:17px;
line-height:1.8;
}

.section-image{
min-height:260px;
background-size:cover;
background-position:center;
}

.cards{
padding:22px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:18px;
}

.menu-card{
background:var(--card);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:18px;
}

.menu-card h3{
margin:0 0 12px;
color:var(--gold-soft);
font-size:24px;
border-bottom:1px solid var(--line);
padding-bottom:10px;
}

.item{
display:flex;
justify-content:space-between;
gap:12px;
padding:9px 0;
border-bottom:1px dashed rgba(255,255,255,.08);
align-items:flex-start;
}

.item:last-child{
border-bottom:none;
}

.item-name{
flex:1;
color:var(--text);
font-size:17px;
line-height:1.45;
}

.price{
color:var(--gold-soft);
font-weight:700;
white-space:nowrap;
padding-left:8px;
font-size:17px;
}

.note{
margin-top:10px;
color:var(--muted);
font-size:14px;
line-height:1.7;
}

.contact{
margin-top:34px;
background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
border:1px solid var(--line);
border-radius:var(--radius);
padding:28px;
text-align:center;
box-shadow:var(--shadow);

<style>
body{
background:#0f2a24;
color:white;
font-family:sans-serif;

.section{

h2{
color:#d4af37;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

}

.card{
